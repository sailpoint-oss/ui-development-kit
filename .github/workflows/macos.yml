name: 'MacOS Build'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false

      - name: Configure pnpm store
        run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary
        run: |
          pnpm rebuild electron
          node -e "const fs=require('fs'); const electron=require('electron'); console.log('Electron binary: ' + electron); if (!fs.existsSync(electron)) throw new Error('Electron binary missing: ' + electron);"

      - name: Run Lint (with increased memory)
        run: pnpm run lint
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Build Component Library
        run: pnpm run build:components
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Build the App
        run: pnpm run electron:build -- --publish=never
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-electron-app
          path: release/**