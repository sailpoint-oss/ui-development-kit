# This is a basic workflow to help you get started with Actions
name: 'Windows Build'

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: read

jobs:
  build:

    # The type of runner that the job will run on
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.15.0'

    - name: Enable Windows long paths
      shell: powershell
      run: |
        # Allow paths longer than 260 chars so deeply-nested node_modules trees
        # don't cause EPERM errors when npm tries to clean up after itself.
        Set-ItemProperty `
          -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
          -Name 'LongPathsEnabled' `
          -Value 1

    - name: Install Dependencies
      # Redirect the npm cache into the workspace so each run starts with a
      # clean cache directory. The shared C:\npm\cache on Windows runners can
      # accumulate stale tmp files that trigger a known npm/cacache EEXIST bug
      # (https://github.com/npm/cli/issues/7308) — a fresh per-run path avoids it.
      env:
        NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
      run: npm install

    - name: Ensure Electron is installed
      shell: powershell
      run: |
        Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
        node -e "const fs = require('fs'); const { createRequire } = require('module'); const os = require('os'); const path = require('path'); const electronDir = path.join(process.cwd(), 'node_modules', 'electron'); const electronRequire = createRequire(path.join(electronDir, 'package.json')); const { downloadArtifact } = electronRequire('@electron/get'); const extract = electronRequire('extract-zip'); const { version } = require(path.join(electronDir, 'package.json')); const pathFile = path.join(electronDir, 'path.txt'); const distPath = path.join(electronDir, 'dist'); const platformPath = os.platform() === 'win32' ? 'electron.exe' : os.platform() === 'darwin' ? path.join('Electron.app', 'Contents', 'MacOS', 'Electron') : 'electron'; async function install() { const zipPath = await downloadArtifact({ version, artifactName: 'electron', checksums: require(path.join(electronDir, 'checksums.json')), platform: os.platform(), arch: process.arch }); fs.rmSync(distPath, { recursive: true, force: true }); await extract(zipPath, { dir: distPath }); fs.writeFileSync(pathFile, platformPath); const electronPath = require('electron'); if (!fs.existsSync(electronPath)) { throw new Error('Electron executable not found at ' + electronPath); } console.log('Electron ready at ' + electronPath); } const keepAlive = setInterval(() => undefined, 1000); install().catch((error) => { console.error(error); process.exitCode = 1; }).finally(() => { clearInterval(keepAlive); });"
        node -e "const fs = require('fs'); const electron = require('electron'); if (!fs.existsSync(electron)) { throw new Error('Electron executable not found at ' + electron); } console.log('Electron ready at ' + electron);"

    - name: Install Angular CLI Globally
      run: npm install -g @angular/cli

    - name: Check lint
      run: npm run lint

    - name: Build Component Library
      run: npm run build:components

    - name: Run headless unit test
      run: npm run test

    - name: Run headless e2e test
      run: |
       npm run e2e

    - name: Build the app
      run: npm run electron:build -- --publish=never

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-electron-app
        path: release/**