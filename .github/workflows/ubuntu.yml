# This is a basic workflow to help you get started with Actions
name: 'Linux Build'

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.5.1
        run_install: false

    - name: Configure pnpm store
      run: pnpm config set store-dir "${{ github.workspace }}/.pnpm-store"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: Install linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf xvfb

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Check lint
      run: pnpm run lint

    - name: Build Component Library
      run: pnpm run build:components

    - name: Run headless unit test
      uses: GabrielBB/xvfb-action@v1
      with:
        run: pnpm run test

    - name: Run headless e2e test
      uses: GabrielBB/xvfb-action@v1
      with:
        run: pnpm run e2e

    - name: Upload e2e artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-e2e-artifacts
        path: |
          e2e/screenshots/**
          e2e/tracing/**
        if-no-files-found: ignore
      
    - name: Build the app
      run: pnpm run electron:build -- --publish=never

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-electron-app
        path: release/**